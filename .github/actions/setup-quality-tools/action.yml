name: Set up quality tools
description: Restore checksum-verified tools and their complete download cache.

runs:
  using: composite
  steps:
    - name: Restore quality tools
      id: cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: .cache/quality-tools
        key: quality-linux-x64-v1-${{ hashFiles('mise.lock', '.mise.toml', '.github/actions/setup-quality-tools/action.yml') }}

    - name: Download the mise bootstrap
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        retries: 2
        script: |
          const fs = require("node:fs/promises");
          const { createHash } = require("node:crypto");
          const response = await github.request("GET /repos/jdx/mise/releases/assets/{asset_id}", {
            asset_id: 541240249,
            headers: { accept: "application/octet-stream" },
            request: { signal: AbortSignal.timeout(90_000) },
          });
          const bytes = Buffer.from(response.data);
          const expected = "063dda9149ab6be53da877c2d176afe0eac68e64cf8ca295bd0528720701c65d";
          if (createHash("sha256").update(bytes).digest("hex") !== expected) {
            throw new Error("The mise bootstrap checksum does not match the pinned release.");
          }
          await fs.mkdir(".cache/quality-tools", { recursive: true });
          await fs.writeFile(".cache/quality-tools/mise.tar.gz", bytes);

    - name: Verify the bootstrap
      shell: bash
      run: |
        printf '%s  %s\n' \
          063dda9149ab6be53da877c2d176afe0eac68e64cf8ca295bd0528720701c65d \
          .cache/quality-tools/mise.tar.gz | sha256sum --check
        tar -xzf .cache/quality-tools/mise.tar.gz --directory .cache/quality-tools
        printf '%s  %s\n' \
          c98423c8470d6dc416d9f7036d0646d8ef5ae92ad9186907f8fcc84cbe7db4ea \
          .cache/quality-tools/mise/bin/mise | sha256sum --check

    - name: Install the locked tools
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      env:
        MISE_DATA_DIR: ${{ github.workspace }}/.cache/quality-tools/mise
        MISE_CACHE_DIR: ${{ github.workspace }}/.cache/quality-tools/mise/cache
        MISE_OFFLINE: ${{ steps.cache.outputs.cache-hit == 'true' }}
        MISE_HTTP_TIMEOUT: 15s
        MISE_HTTP_DOWNLOAD_TIMEOUT: 2m
        MISE_HTTP_RETRIES: "2"
        MISE_JOBS: "4"
        MISE_USE_VERSIONS_HOST: "false"
        MISE_USE_VERSIONS_HOST_TRACK: "false"
        MISE_WINGS_ENABLED: "false"
      with:
        version: 2026.9.1
        sha256: c98423c8470d6dc416d9f7036d0646d8ef5ae92ad9186907f8fcc84cbe7db4ea
        mise_dir: ${{ github.workspace }}/.cache/quality-tools/mise
        cache: "false"
        install_args: --locked

    - name: Save quality tools
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: .cache/quality-tools
        key: ${{ steps.cache.outputs.cache-primary-key }}
