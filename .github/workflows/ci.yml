name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: swift:6.3.2-noble@sha256:c4336909a71b2e69b884f4078cdf98c0cd081911632cb349ef72abc4cbed69fc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup-quality-tools
      - run: mise run quality
        env:
          MISE_OFFLINE: "true"
          MISE_LOCKED: "true"

  linux:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: swift:6.3.2-noble@sha256:c4336909a71b2e69b884f4078cdf98c0cd081911632cb349ef72abc4cbed69fc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build
          key: support-linux-${{ hashFiles('Package.resolved', '.swift-version') }}
      - run: swift build
      - run: swift test
      - run: Scripts/check-history-fixtures.sh
      - run: swift run --skip-build toolchain verify
      - run: git ls-files -z | swift run --skip-build toolchain check-repository

  macos:
    name: macOS build and tests
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build
          key: support-macos-xcode26.6-${{ hashFiles('Package.resolved', '.swift-version') }}
      - run: swift build
      - run: swift test
      - run: Scripts/check-history-fixtures.sh
      - run: swift run --skip-build toolchain verify
      - run: git ls-files -z | swift run --skip-build toolchain check-repository

  documentation:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: swift:6.3.2-noble@sha256:c4336909a71b2e69b884f4078cdf98c0cd081911632cb349ef72abc4cbed69fc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: Scripts/docs.sh

  commits:
    name: Commit policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: swift:6.3.2-noble@sha256:c4336909a71b2e69b884f4078cdf98c0cd081911632cb349ef72abc4cbed69fc
    env:
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: swift build
      - name: Check non-merge commit messages and DCO trailers
        shell: bash
        run: Scripts/check-history.sh . "$PR_BASE" "$PR_HEAD"

  native:
    name: Native bridge contract
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MISE_DATA_DIR: ${{ github.workspace }}/.cache/native-tools/mise
      MISE_CACHE_DIR: ${{ github.workspace }}/.cache/native-tools/mise/cache
      MISE_WINGS_ENABLED: "false"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          sha256: 3cfbe3295dba1a7e43bd02653517a8cc21135ba91f0635b45c98f1ebecc5513f
          mise_dir: ${{ github.workspace }}/.cache/native-tools/mise
          install_args: --locked
      - run: mise run native-check
